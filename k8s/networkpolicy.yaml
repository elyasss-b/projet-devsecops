# Seul l'ingress controller (Traefik, namespace kube-system) peut joindre les pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notes-app-ingress
  namespace: notes
spec:
  podSelector:
    matchLabels:
      app: notes-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 5000
